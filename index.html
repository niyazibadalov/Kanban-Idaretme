<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban İdarəetmə</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header__logo">
            <span class="header__logo-icon">K</span>
            <h1 class="header__title">Kanban İdarəetmə</h1>
        </div>
        <div class="header__controls">
            <div class="search-box">
                <input type="text" id="search-input" class="search-box__input" placeholder="Tapşırıq haqqında axtar...">
            </div>
            <div class="filter-box">
                <select id="priority-filter" class="filter-box__select">
                    <option value="all">Bütün prioritetlər</option>
                    <option value="low">Aşağı</option>
                    <option value="medium">Orta</option>
                    <option value="high">Yüksək</option>
                </select>
            </div>
            <button id="open-modal-btn" class="btn btn--primary">+ Yeni Tapşırıq</button>
        </div>
    </header>

    <main class="board">
        <div class="column" data-status="todo">
            <div class="column__header">
                <div class="column__title-wrap">
                    <span class="column__dot column__dot--todo"></span>
                    <h2 class="column__title">Gözləmədə</h2>
                </div>
                <span class="column__count" id="count-todo">0</span>
            </div>
            <div class="column__tasks" id="tasks-todo"></div>
        </div>

        <div class="column" data-status="in-progress">
            <div class="column__header">
                <div class="column__title-wrap">
                    <span class="column__dot column__dot--in-progress"></span>
                    <h2 class="column__title">İcra olunur</h2>
                </div>
                <span class="column__count" id="count-in-progress">0</span>
            </div>
            <div class="column__tasks" id="tasks-in-progress"></div>
        </div>

        <div class="column" data-status="done">
            <div class="column__header">
                <div class="column__title-wrap">
                    <span class="column__dot column__dot--done"></span>
                    <h2 class="column__title">Tamamlandı</h2>
                </div>
                <span class="column__count" id="count-done">0</span>
            </div>
            <div class="column__tasks" id="tasks-done"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban İdarəetmə</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Header & Controls -->
    <header class="header">
        <div class="header__logo">
            <span class="header__logo-icon">K</span>
            <h1 class="header__title">Kanban İdarəetmə</h1>
        </div>
        <div class="header__controls">
            <div class="search-box">
                <input type="text" id="search-input" class="search-box__input" placeholder="Tapşırıq haqqında axtar...">
            </div>
            <div class="filter-box">
                <select id="priority-filter" class="filter-box__select">
                    <option value="all">Bütün prioritetlər</option>
                    <option value="low">Aşağı</option>
                    <option value="medium">Orta</option>
                    <option value="high">Yüksək</option>
                </select>
            </div>
            <button id="open-modal-btn" class="btn btn--primary">+ Yeni Tapşırıq</button>
        </div>
    </header>

    <!-- Kanban Board -->
    <main class="board">
        <!-- Column 1: Todo -->
        <div class="column" data-status="todo">
            <div class="column__header">
                <div class="column__title-wrap">
                    <span class="column__dot column__dot--todo"></span>
                    <h2 class="column__title">Gözləmədə</h2>
                </div>
                <span class="column__count" id="count-todo">0</span>
            </div>
            <div class="column__tasks" id="tasks-todo"></div>
        </div>

        <!-- Column 2: In Progress -->
        <div class="column" data-status="in-progress">
            <div class="column__header">
                <div class="column__title-wrap">
                    <span class="column__dot column__dot--in-progress"></span>
                    <h2 class="column__title">İcra olunur</h2>
                </div>
                <span class="column__count" id="count-in-progress">0</span>
            </div>
            <div class="column__tasks" id="tasks-in-progress"></div>
        </div>

        <!-- Column 3: Done -->
        <div class="column" data-status="done">
            <div class="column__header">
                <div class="column__title-wrap">
                    <span class="column__dot column__dot--done"></span>
                    <h2 class="column__title">Tamamlandı</h2>
                </div>
                <span class="column__count" id="count-done">0</span>
            </div>
            <div class="column__tasks" id="tasks-done"></div>
        </div>
    </main>

    <!-- Modal (Əlavə et / Redaktə et) -->
    <div id="task-modal" class="modal">
        <div class="modal__content">
            <h2 id="modal-title" class="modal__title">Yeni Tapşırıq</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                
                <div class="form-group">
                    <label for="task-title-input" class="form-label">Başlıq *</label>
                    <input type="text" id="task-title-input" class="form-control" placeholder="Məsl. API inteqrasiyası" required>
                </div>

                <div class="form-group">
                    <label for="task-desc-input" class="form-label">Açıqlama</label>
                    <textarea id="task-desc-input" class="form-control" rows="3" placeholder="Tapşırıq haqqında qısa qeyd..."></textarea>
                </div>

                <div class="form-group">
                    <label for="task-priority-input" class="form-label">Prioritet dərəcəsi</label>
                    <select id="task-priority-input" class="form-control">
                        <option value="low">Aşağı (Low)</option>
                        <option value="medium">Orta (Medium)</option>
                        <option value="high">Yüksək (High)</option>
                    </select>
                </div>

                <div class="modal__actions">
                    <button type="button" id="close-modal-btn" class="btn btn--secondary">Ləğv et</button>
                    <button type="submit" class="btn btn--primary">Yadda saxla</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
